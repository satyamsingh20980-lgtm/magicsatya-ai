name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app/" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cp -r $PROJECT_DIR/* ./ 2>/dev/null || true
          cp -r $PROJECT_DIR/.* ./ 2>/dev/null || true
        fi

    - name: Generate Proper Google Services JSON & Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

        mkdir -p app
        echo '{"project_info":{"project_number":"123456789","project_id":"magicsatya-ai","storage_bucket":"magicsatya-ai.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.aistudio.magicsatya.app"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}]}]}' > app/google-services.json

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build APK
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --no-daemon -x validateSigningDebug
        else
          gradle assembleDebug --no-daemon -x validateSigningDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
