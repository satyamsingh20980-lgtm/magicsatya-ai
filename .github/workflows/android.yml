name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Setup Project
      run: |
        unzip -o magicsatya-ai.zip -d temp_extracted
        GRADLEW_PATH=$(find temp_extracted -name "gradlew" | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        rsync -av "$PROJECT_DIR/" .
        rm -rf temp_extracted

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
