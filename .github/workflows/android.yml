name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app/" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cp -r $PROJECT_DIR/* ./ 2>/dev/null || true
          cp -r $PROJECT_DIR/.* ./ 2>/dev/null || true
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle (No Cache)
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build APK with Gradle Wrapper
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
