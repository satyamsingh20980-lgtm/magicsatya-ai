name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract ZIP File Cleanly
      run: |
        unzip -o magicsatya-ai.zip -d extracted_project
        if [ -f "extracted_project/gradlew" ]; then
          cp -r extracted_project/* .
          cp -r extracted_project/.* . 2>/dev/null || true
        else
          INSIDE_DIR=$(find extracted_project -maxdepth 2 -name "gradlew" | head -n 1 | xargs dirname)
          cp -r $INSIDE_DIR/* .
          cp -r $INSIDE_DIR/.* . 2>/dev/null || true
        fi
        rm -rf extracted_project

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
